[project]
name = "sashimono"
# 版は src/sashimono/__init__.py の __version__ が唯一の出どころ
# 2 か所に書くと、更新の配布で必ずずれる（配った版と中身の版が食い違う）
dynamic = ["version"]
description = "AviUtl 互換と AI エージェント連携を備えた Python 製の動画編集ソフト"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "PySide6>=6.11",
    "av>=18.0",
    "numpy>=2.0",
    "PyOpenGL>=3.1.10",
    "sounddevice>=0.5",
    # 追加機能の導入状況で、入っている版が条件を満たすかを比べる（runtime.py）
    # 起動のたびに読むので、追加機能の側ではなくここに置く
    "packaging>=24",
    # AviUtl スクリプトを動かす Lua 既定で入れる（互換機能の土台なので、
    # 追加導入にすると「スクリプトが動かない」が既定の状態になる）
    "lupa>=2.5",
    # 自動更新の目録の署名（Ed25519）を確かめる 配る zip には前から入っている（AI 連携の
    # 依存と分け合うため THIRD_PARTY_NOTICES.md にも載っている） 本体が使うのでここに書く
    "cryptography>=44",
]

[project.optional-dependencies]
asr = [
    # 字幕起こしの実行環境 既定では入れない（合計で 2 GB を超えるため）
    # ソフト内の「環境を導入」ボタンから、必要になった時点で入れる
    "faster-whisper>=1.1",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9.1",
]
ai = [
    # AI 連携 既定では入れない Claude Code 本体は SDK に同梱されている
    # （0.2.152 で確かめた） 動かすには Claude へのログインか API キーが要る
    "claude-agent-sdk>=0.2.152",
]
dev = [
    "pytest>=8.0",
    # CI だけテストを並列に走らせる（tools/verify.py の SASHIMONO_TEST_WORKERS）
    # 直列では pytest が CI の 9 割以上を占め、1 回に 6 分かかっていた（#239）
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "ruff>=0.14",
    "mypy>=1.14",
    # 配る zip を作る（tools/build_package.py） 使う人の機械には入らない
    "pyinstaller>=6.22",
]
mutation = [
    # Windows で動く mutation testing mutmut は fork が要るため WSL の外では動かない
    "pytest-gremlins==1.9.0",
    # 生成例が変わると mutation の基準値も動くため、この検査だけは版を固定する
    "hypothesis==6.168.1",
]

[project.scripts]
sashimono = "sashimono.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sashimono/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sashimono"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH", "ARG"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# fixture と偽物の callback は、呼ぶ側の署名に合わせるため使わない引数を持つ
"tests/**/*.py" = ["ARG"]

[tool.pytest-gremlins]
# 過去のレビューで境界値と状態遷移の指摘が繰り返された、外部機器なしで試せる核から始める
# 全体を一度に対象にすると数時間になり、PR の検査として待てなくなる
paths = [
    "src/sashimono/core/timebase.py",
    "src/sashimono/core/io/locks.py",
]
operators = ["comparison", "boundary", "boolean", "arithmetic", "return"]
workers = 2
cache = true
report = ["console", "json"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# PyOpenGL は型情報を配布していない GL 呼び出しは薄い層に閉じ込めてあるので、
# ここだけ型検査の対象外にする
#
# faster_whisper と claude_agent_sdk は**任意の依存**で、既定では入らない
# （字幕起こしと AI 連携の実行環境 合計 2 GB を超えるため） 入っていない
# 環境でも型検査が通るようにしておく 入っている環境では実物で検査される
[[tool.mypy.overrides]]
module = ["OpenGL.*", "faster_whisper.*", "sounddevice", "claude_agent_sdk.*"]
ignore_missing_imports = true
