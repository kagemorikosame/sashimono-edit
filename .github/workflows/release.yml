name: Release

# 配る zip を Actions で組み立て、リリースの**下書き**へ上げる（自動更新 F-12-7）
# 署名はしない 秘密鍵をリポジトリのシークレットに置くと、workflow を書き換えられる人なら
# 誰でも取り出せる 目録（update.json）を作って署名するのは手元（tools/update_sign.py）
# 下書きのままにするのは、署名を上げる前に releases/latest/download/… が動かないようにするため
# 手順は docs/development.md の「自動更新のリリース」
#
# 組み立てと上げるのはジョブを分ける 組み立ては PyPI から依存を入れて走らせるので、
# 依存のどれかが悪さをしても、リリースを書き換えられるトークンに手が届かないようにする
# （書ける権限は、依存を何も入れない publish のジョブだけが持つ）

on:
  push:
    tags: ["v*"]

# 既定は何も持たせない 要る物はジョブごとに書く
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    # 組み立てと、まっさらな Windows で zip から起動する確かめ（Issue #33）は package.yml
    # main への push でも同じ物を走らせるので、ここへ写さずに呼ぶ 確かめが落ちれば
    # このジョブが落ち、publish は走らない（動かない zip を下書きへ上げない）
    uses: ./.github/workflows/package.yml
    permissions:
      # ソースを読むだけ 依存を入れて走らせるジョブに書く権限を渡さない
      contents: read

  publish:
    needs: package
    # 依存を何も入れない 使うのは runner に入っている gh だけ
    runs-on: ubuntu-latest
    permissions:
      # リリースの下書きを作り、zip を上げるのに要る これより広くしない
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: package

      - name: リリースの下書きへ上げる
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(package/SashimonoEdit-*-windows-x64.zip)
          if [ "${#zips[@]}" -ne 1 ]; then echo "組み立てた zip が 1 つでない"; exit 1; fi
          zip="${zips[0]}"
          echo "SHA-256: $(sha256sum "$zip" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          if info=$(gh release view "$TAG" --json isDraft,assets 2>/dev/null); then
            # 公開済みのリリースの zip を差し替えない 組み立て直した zip は SHA-256 が変わり、
            # 署名済みの update.json と食い違って、全員の自動更新が照合で止まる
            if [ "$(jq -r '.isDraft' <<<"$info")" != "true" ]; then
              echo "::error::$TAG は公開済み zip を差し替えない（新しい版はタグを上げて出す）"
              exit 1
            fi
            # 下書きでも、目録と署名を上げた後なら差し替えない 署名した SHA-256 と食い違う
            # 作り直すなら update.json と update.json.sig を消してから、もう一度走らせる
            if jq -e '.assets[] | select(.name == "update.json" or .name == "update.json.sig")' \
              <<<"$info" > /dev/null; then
              echo "::error::$TAG には署名した目録がある zip を差し替えない"
              exit 1
            fi
          else
            # 下書きで作る 署名と目録を上げてから、人が公開する
            pre=()
            if [[ "$TAG" =~ (a|b|rc)[0-9]+$ ]]; then pre=(--prerelease); fi
            # リリースノートの雛形 更新のしかた（自動と手で入れ替えるときの違い）を毎回同じ
            # 言い方で載せる 手で入れ替えると exe の隣の scripts が消えることを、書き忘れない
            # Python が前に公開した版から変わるなら、入れ直しの知らせを先頭に置く（読み飛ばされない所）
            # 比べる目録の順は tools/release.py の previous_manifest_urls と同じ（ここは依存を入れない
            # ジョブなので呼べない 揃っているかは tests/test_release_workflow.py が見る）
            # ベータは beta の目録を先に見て、無ければ正式版 正式版は固定の URL だけ
            # どれも読めなければ（初めての公開）比べない
            abi=$(unzip -p "$zip" 'Sashimono/build-info.json' | jq -r '.python_abi')
            previous=("https://github.com/$GH_REPO/releases/latest/download/update.json")
            if [ "${#pre[@]}" -gt 0 ]; then
              previous=("https://github.com/$GH_REPO/releases/download/beta/update.json" "${previous[@]}")
            fi
            before=""
            for url in "${previous[@]}"; do
              before=$( (curl -fsSL "$url" | jq -r '.python_abi') 2>/dev/null || true)
              if [ -n "$before" ] && [ "$before" != "null" ]; then break; fi
              before=""
            done
            notes=$(mktemp)
            {
              if [ -n "$before" ] && [ "$before" != "$abi" ]; then
                cat <<EOF
          > [!WARNING]
          > **この版では Python が変わります（$before → $abi）**
          > 字幕起こし・AI 連携を入れている人は、更新した後に入れ直しが要ります 入れてある物は消えませんが、
          > 入れ直すまでその機能は使えません 落とし直す量は入れた機能によって数百 MB から 2 GB を超え、回線によって
          > 数分から 20 分ほど掛かります（入れる前の確認に、今入れてある大きさと時間の目安を出します）
          > 締め切りの前は、更新を後にしてください

          EOF
              fi
              cat <<'EOF'
          <!-- 署名と目録はこれから上げる 公開する前に「変わった所」を書く 手順は docs/development.md の「リリースノート」 -->
          ## 変わった所

          -

          ## 更新のしかた

          - **自動更新**（〔ヘルプ〕→〔更新を確かめる…〕 起動したときにも確かめます） 設定・スクリプト・テンプレート・入れた字幕起こしや AI 連携はそのまま残ります `Sashimono.exe` の隣の `scripts` に置いた物も、新しい版へ写します
          - **手で入れ替えるとき**（zip を落として展開し直す） `Sashimono.exe` の隣の `scripts` に自分で置いた物は、フォルダごと入れ替えると消えます 入れ替える前に、〔互換〕→〔スクリプトフォルダを開く〕で開く `%APPDATA%\Sashimono\scripts` へ移してください（〔互換〕→〔exe の隣のスクリプトを移す…〕がある版なら、それで移せます） zip を元のフォルダへ上書きで展開するだけなら消えません `%APPDATA%\Sashimono` と `%LOCALAPPDATA%\Sashimono` にある物（設定・テンプレート・エイリアス・退避・入れた実行環境）は、どちらの入れ替えでも消えません
          EOF
            } > "$notes"
            gh release create "$TAG" --draft --verify-tag --title "Sashimono Edit $TAG" \
              --notes-file "$notes" "${pre[@]}"
          fi
          gh release upload "$TAG" "$zip" --clobber
