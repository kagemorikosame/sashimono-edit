name: CI

# 手元と同じものを走らせる CI だけ別の手順にすると、どちらかが必ず腐る
#   .venv\Scripts\python.exe tools\verify.py
# = ruff（書式・規約）→ mypy（strict）→ pytest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # 同じブランチへ続けて push したとき、古い実行を止める
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Windows 専用のソフトなので、Windows で検証する
    runs-on: windows-latest

    env:
      # CI に入れる ffmpeg 手元の開発環境（README）と、配る zip の FFmpeg（PyAV の
      # wheel）と同じ 8.1.2 にそろえる 版とハッシュは置き場の鍵にもそのまま使うので、
      # ここを変えれば取り直しと鍵が一緒に変わる
      FFMPEG_VERSION: 8.1.2
      # 取った zip をこの値と照らしてから展開する 照らさないと、配布元のリリースが
      # 差し替えられたときに、その実行ファイルを CI の中で動かすことになる
      # 値は GitHub のリリースの digest と gyan.dev の .sha256 の両方で一致を確かめた
      FFMPEG_SHA256: db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec

    strategy:
      fail-fast: false
      matrix:
        # 3.12 は pyproject が宣言している下限 ここで確かめないと宣言が嘘になる
        # 3.14 は実際に開発と配布に使う版
        python: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # uv の控えは持ち越さない 測ると読み戻しに 10〜13 秒かかり、入れる時間は
          # 24 秒から 20 秒にしか縮まなかった（持ち越さない方が 6 秒速い）
          enable-cache: false

      - name: 依存を入れる
        # pip は解決と展開に毎回 1 分近くかかっていた uv は同じことを 20 秒ほどで済ませる
        # setup-python の Python へ入れる 検証の手順は素の python を呼ぶので、uv の
        # 仮想環境に入れると別の Python から見えなくなる
        run: uv pip install --python "${{ steps.python.outputs.python-path }}" -e ".[dev]"

      - name: ffmpeg の置き場を読み戻す
        id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ env.FFMPEG_VERSION }}-essentials-${{ env.FFMPEG_SHA256 }}

      - name: ffmpeg を入れる
        id: ffmpeg
        # 素材を使うテストが要る 無くても各テストが自分で飛ばすので、
        # ここが失敗しても CI 全体は止めない
        # choco は毎回 35 秒ほどかかっていた 版を決めた静的ビルドを取り、置き場を持ち越す
        continue-on-error: true
        shell: pwsh
        env:
          FFMPEG_DIR: ${{ runner.temp }}/ffmpeg
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:FFMPEG_DIR 'ffmpeg.exe'
          $probe = Join-Path $env:FFMPEG_DIR 'ffprobe.exe'
          $fresh = 'false'
          # 読み戻したかどうかではなく、実行ファイルがそろっているかで決める 途中までの
          # 置き場が読み戻されても、取り直せる
          if (-not ((Test-Path $exe) -and (Test-Path $probe))) {
            if (Test-Path $env:FFMPEG_DIR) { Remove-Item -Recurse -Force $env:FFMPEG_DIR }
            $name = "ffmpeg-$env:FFMPEG_VERSION-essentials_build"
            $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
            Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/$name.zip" -OutFile $zip
            $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $env:FFMPEG_SHA256) { throw "ffmpeg の zip のハッシュが違う: $actual" }
            Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
            New-Item -ItemType Directory -Force $env:FFMPEG_DIR | Out-Null
            Copy-Item (Join-Path $env:RUNNER_TEMP "$name/bin/*.exe") $env:FFMPEG_DIR
            $fresh = 'true'
          }
          # 出力を全部受けてから 1 行だけ出す パイプで先頭だけ取ると ffmpeg が途中で
          # 止められて終了コードが 0 でなくなり、動いているのに入っていない扱いになる
          $version = & $exe -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg が動かない' }
          $version | Select-Object -First 1
          Add-Content $env:GITHUB_PATH $env:FFMPEG_DIR
          "fresh=$fresh" | Add-Content $env:GITHUB_OUTPUT

      - name: ffmpeg の置き場を保存する
        # 照らして動いた物を取り直したときだけ保存する 取る途中で落ちた置き場を
        # 保存すると、鍵を変えるまで壊れた置き場が読み戻され続ける
        if: steps.ffmpeg.outcome == 'success' && steps.ffmpeg.outputs.fresh == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}

      - name: mypy の控えを持ち越す
        # strict の mypy は毎回まっさらな状態から全ファイルを読んでいた 控えがあれば
        # 中身の変わらないモジュールを読み直さない 鍵にコミットを入れて毎回保存し、
        # 読むときは同じ Python と設定の一番新しい控えを使う
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}-

      - name: 検証
        # GPU が無いので OpenGL のテストは自分で飛ぶ ruff・mypy と、
        # GL を使わないテストはすべて走る
        # 件数と落ちたテストの名前は verify.py が実行の要約（GITHUB_STEP_SUMMARY）に
        # 書く GPU の無い CI では GL のテストが大量に飛ぶので、「通った」だけでは
        # 何を確かめたのか分からない 以前は件数のためだけに pytest をもう 1 度回して
        # いて、時間が倍かかり、たまにだけ落ちるテストを踏む回数も倍になっていた
        env:
          # pytest をランナーの 4 コアで並べて走らせる（pytest-xdist #239） 直列では
          # 1 回に 4〜5 分かかり、CI の 9 割以上を占めていた 遅いのは一部のテストでなく
          # 数千本の短いテストの積み重ね（--durations の上位 30 本で 40 秒）なので、
          # 並べる以外に縮める手が無い 並列を疑うときは 0 にすれば直列へ戻る
          SASHIMONO_TEST_WORKERS: "4"
        run: python tools/verify.py
