# CodeRabbit の設定 PR を出すと自動でレビューが付く
# 開発ルールの大本は docs/development.md ここはその一部を機械に見させるもの
#
# 使い方:
#   - 追加で見てほしいとき  → PR で「@coderabbitai review」
#   - 指摘に反論するとき    → そのコメントに返信する（会話できる）
#
# 指摘は読んで判断する 機械的に全部直すのでも、全部無視するのでもない
# 直さないときは理由を PR のコメントに残す

language: ja-JP

reviews:
  # 落ち着いた口調 細かい指摘を大量に出されると本題が埋もれる
  profile: chill

  # 指摘が残っている間は「変更を求める」、全部片付いたら承認を出す
  # 変更を求める状態は、必須承認が 0 でもマージを止める（PR #18 で確かめた）
  # 枠切れで見直しが返ってこないときは、管理者が画面でそのレビューを外す
  # 承認そのものを門にはしていない（main の必須承認は 0 のまま） 進み具合が
  # PR の一覧から見えるようにするためで、承認が出ても会話の解決と CI は別に要る
  request_changes_workflow: true

  high_level_summary: true
  review_status: true
  poem: false

  auto_review:
    enabled: true
    # 書きかけ（draft）は見なくてよい
    drafts: false
    base_branches:
      - main
    # ボットの PR は黙って飛ばす CodeRabbit は契約の席を人にしか割り当てないので、
    # ボットの PR は頼んでも「Review skipped」と書くだけで審査しない
    # その書き込みが PR ごとに残ると、人の PR と見分けにくくなる
    # 名前は完全一致で比べるので、GitHub の login の `[bot]` まで書く
    # ボットの PR の確かめ方は docs/development.md の「Dependabot の PR」
    ignore_usernames:
      - "dependabot[bot]"

  path_filters:
    - "!**/*.png"
    - "!**/*.ico"
    - "!**/*.svg"
    # 他人が作った配布物 こちらの書き方の基準では見ない
    - "!tests/fixtures/**"

  path_instructions:
    # すべてのファイルに掛かる進め方 懸念点は同じブランチで直すのがこのリポジトリの決まり
    # （docs/development.md の「懸念点は同じブランチで直す」） 別の PR へ分ける勧めが来ると、
    # レビューの回数が増える
    - path: "**"
      instructions: |
        このリポジトリでは、作業中やレビューで出た懸念点を別の Issue や PR に分けず、
        できるだけ同じ PR の中で直す決まりです

        - 「別の PR に分ける」「後続の Issue で対応する」ことを勧めないでください
          見つけた懸念は、この PR の中で直す前提で、直し方と一緒に指摘してください
        - 外のライブラリの中や、実物のアプリの起動・利用者の判断が要る物のように、
          この PR では直せない物だけは、その理由を添えて切り出しを勧めてかまいません

    - path: "src/sashimono/**/*.py"
      instructions: |
        このプロジェクトの約束を見てください

        - コメントは日本語で「なぜそう書いたか」を説明するもの
          何をしているかを言い換えただけのコメントがあれば指摘してください
        - TODO / FIXME / XXX をコードに残さない方針です あれば指摘してください
        - 文章に句点（まる）を使わない方針です 文の途中は半角空白で区切ります
          機械の検査（tools/punctuation.py）があるので個別の指摘は不要ですが、
          逆に「句点が無いので文として不完全」という指摘もしないでください
          ただし `src/sashimono/asr/cleanup.py` の句点の一覧や正規表現はデータです
        - `src/sashimono/core/` は GUI に依存しません ここで PySide6 を
          import していたら指摘してください
        - モデル（Project / Timeline / Clip）の変更は必ず `Command` 経由です
          直接書き換えていたら指摘してください
        - 座標の Y は上が正です 新しく位置を扱うコードで下向きに
          なっていないか見てください
        - 型は mypy strict で通ります `type: ignore` に理由が
          書かれていなければ指摘してください

    - path: "src/sashimono/compat/**/*.py"
      instructions: |
        他ソフト（AviUtl / YMM4）の資産を読む層です

        - 未対応のものを黙って捨てていないか見てください
          `CompatibilityReport` に記録してから先へ進むのが約束です
        - 例外で全体を止めていないか見てください 1 種類読めないだけで
          ファイル全体が落ちるのは避けたい作りです
        - 形式の判定を、名前空間やアセンブリ名など版で変わるもので
          行っていないか見てください（クラス名だけで振り分けます）

    - path: "tests/**/*.py"
      instructions: |
        テストの書き方の約束です

        - テスト名とコメントに「壊れたときに何が起きるか」が書かれているか
          見てください assert が通ることだけを書いたテストは指摘してください
        - 実行する機械の状態（GPU の有無、ffmpeg の有無、特定のフォルダの
          存在）に依存するテストは、無いときに飛ぶようになっているか
          見てください

    - path: ".github/workflows/*.yml"
      instructions: |
        CI は手元の `tools/verify.py` と同じものを走らせる方針です
        片方だけに検査が増えていたら指摘してください

chat:
  auto_reply: true
